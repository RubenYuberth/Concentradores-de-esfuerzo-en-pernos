<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zonas críticas de un perno</title>
  <link rel="stylesheet" href="/src/style.css">
  <script type="module" src="/src/main.ts"></script>
</head>
<body>
<div id="vis-container">
<h2 class="sr">Corte esquemático de un perno con las zonas de mayor concentración de esfuerzos según el tipo de carga: tracción axial, flexión, cortante y torsión.</h2>
<div class="tabs">
<button class="tab" id="b0" aria-pressed="true">Tracción axial</button>
<button class="tab" id="b1" aria-pressed="false">Flexión</button>
<button class="tab" id="b2" aria-pressed="false">Cortante</button>
<button class="tab" id="b3" aria-pressed="false">Torsión de apriete</button>
</div>
<svg width="100%" viewBox="0 0 680 360" role="img">
<title>Zonas críticas de un perno</title>
<desc>Corte lateral de un perno que une dos placas con una tuerca. Círculos numerados indican dónde se concentran los esfuerzos para cada tipo de carga.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></marker></defs>
<g class="c-gray">
<rect x="50" y="80" width="105" height="80" stroke-width="0.5"></rect>
<rect x="225" y="80" width="105" height="80" stroke-width="0.5"></rect>
<rect x="50" y="160" width="105" height="80" stroke-width="0.5"></rect>
<rect x="225" y="160" width="105" height="80" stroke-width="0.5"></rect>
<rect x="130" y="240" width="30" height="60" stroke-width="0.5"></rect>
<rect x="220" y="240" width="30" height="60" stroke-width="0.5"></rect>
<text class="ts" x="102" y="124" text-anchor="middle">Placa 1</text>
<text class="ts" x="102" y="204" text-anchor="middle">Placa 2</text>
</g>
<text class="ts" x="256" y="292">Tuerca</text>
<g stroke="#185FA5" stroke-width="0.8" fill="#85B7EB">
<rect x="130" y="40" width="120" height="40" rx="3"></rect>
<rect x="160" y="80" width="60" height="135"></rect>
<polygon points="165,215 160,221 165,227 160,233 165,239 160,245 165,251 160,257 165,263 160,269 165,275 160,281 165,287 160,293 165,299 160,305 165,311 160,317 165,323 160,329 165,335 215,335 220,329 215,323 220,317 215,311 220,305 215,299 220,293 215,287 220,281 215,275 220,269 215,263 220,257 215,251 220,245 215,239 220,233 215,227 220,221 215,215"></polygon>
<path d="M153 80 Q160 80 160 87 L160 80 Z" stroke="none"></path>
<path d="M227 80 Q220 80 220 87 L220 80 Z" stroke="none"></path>
</g>
<text class="th" x="190" y="60" text-anchor="middle" dominant-baseline="central" style="fill:#0C447C">Cabeza</text>
<g id="bars" class="tg">
<rect x="51" y="242" width="75" height="8" fill="#A32D2D"></rect>
<rect x="75" y="254" width="51" height="8" fill="#EF9F27"></rect>
<rect x="91" y="266" width="35" height="8" fill="#EF9F27"></rect>
<rect x="102" y="278" width="24" height="8" fill="#EF9F27" fill-opacity=".8"></rect>
<rect x="108" y="290" width="18" height="8" fill="#EF9F27" fill-opacity=".6"></rect>
<text class="ts" x="40" y="318">Carga por rosca</text>
<text class="ts" x="40" y="332">(aproximada)</text>
</g>
<g id="load1" class="tg">
<line class="arr" x1="290" y1="76" x2="290" y2="46" marker-end="url(#arrow)"></line>
<line class="arr" x1="290" y1="244" x2="290" y2="274" marker-end="url(#arrow)"></line>
<text class="ts" x="300" y="64">F</text>
<text class="ts" x="300" y="262">F</text>
</g>
<g id="wedge" class="tg" style="opacity:0">
<polygon points="130,80 156,80 130,88" fill="#EF9F27" fill-opacity=".7"></polygon>
<path class="arr" d="M112 72 Q96 59 112 46" fill="none" marker-end="url(#arrow)"></path>
<text class="ts" x="88" y="63" text-anchor="middle">M</text>
</g>
<g id="load3" class="tg" style="opacity:0">
<line class="arr" x1="334" y1="120" x2="366" y2="120" marker-end="url(#arrow)"></line>
<line class="arr" x1="46" y1="200" x2="14" y2="200" marker-end="url(#arrow)"></line>
<text class="ts" x="350" y="108" text-anchor="middle">V</text>
<text class="ts" x="30" y="188" text-anchor="middle">V</text>
</g>
<g id="load4" class="tg" style="opacity:0">
<path class="arr" d="M148 28 Q190 8 232 28" fill="none" marker-end="url(#arrow)"></path>
<text class="ts" x="246" y="24">T</text>
</g>
<g class="hz tg" data-z="1" data-s="L"><circle cx="160" cy="248" r="11" fill="#A32D2D" stroke="var(--surface-2)" stroke-width="1.5"></circle><text class="th" x="160" y="248" text-anchor="middle" dominant-baseline="central" style="fill:#fff">1</text></g>
<g class="hz tg" data-z="1" data-s="R"><circle cx="220" cy="248" r="11" fill="#A32D2D" stroke="var(--surface-2)" stroke-width="1.5"></circle><text class="th" x="220" y="248" text-anchor="middle" dominant-baseline="central" style="fill:#fff">1</text></g>
<g class="hz tg" data-z="2" data-s="L"><circle cx="160" cy="222" r="10" fill="#EF9F27" stroke="var(--surface-2)" stroke-width="1.5"></circle><text class="th" x="160" y="222" text-anchor="middle" dominant-baseline="central" style="fill:#412402">2</text></g>
<g class="hz tg" data-z="2" data-s="R"><circle cx="220" cy="222" r="10" fill="#EF9F27" stroke="var(--surface-2)" stroke-width="1.5"></circle><text class="th" x="220" y="222" text-anchor="middle" dominant-baseline="central" style="fill:#412402">2</text></g>
<g class="hz tg" data-z="3" data-s="L"><circle cx="160" cy="84" r="9" fill="#FAC775" stroke="var(--surface-2)" stroke-width="1.5"></circle><text class="th" x="160" y="84" text-anchor="middle" dominant-baseline="central" style="fill:#412402">3</text></g>
<g class="hz tg" data-z="3" data-s="R"><circle cx="220" cy="84" r="9" fill="#FAC775" stroke="var(--surface-2)" stroke-width="1.5"></circle><text class="th" x="220" y="84" text-anchor="middle" dominant-baseline="central" style="fill:#412402">3</text></g>
<g class="hz tg" data-z="4" data-s="C" style="opacity:0"><rect x="160" y="155" width="60" height="10" fill="#A32D2D" fill-opacity=".35"></rect><circle cx="190" cy="160" r="11" fill="#A32D2D" stroke="var(--surface-2)" stroke-width="1.5"></circle><text class="th" x="190" y="160" text-anchor="middle" dominant-baseline="central" style="fill:#fff">4</text></g>
<g class="hz tg" data-z="5" data-s="L" style="opacity:0"><circle cx="160" cy="120" r="10" fill="#EF9F27" stroke="var(--surface-2)" stroke-width="1.5"></circle><text class="th" x="160" y="120" text-anchor="middle" dominant-baseline="central" style="fill:#412402">5</text></g>
<g class="hz tg" data-z="5" data-s="R" style="opacity:0"><circle cx="220" cy="200" r="10" fill="#EF9F27" stroke="var(--surface-2)" stroke-width="1.5"></circle><text class="th" x="220" y="200" text-anchor="middle" dominant-baseline="central" style="fill:#412402">5</text></g>
<g id="lr1" class="tg"><circle id="lc1" cx="404" cy="50" r="11" fill="#A32D2D" stroke="var(--surface-2)" stroke-width="1.5"></circle><text id="ln1" class="th" x="404" y="50" text-anchor="middle" dominant-baseline="central" style="fill:#fff">1</text><text class="th" x="424" y="43" dominant-baseline="central">Primera rosca bajo la tuerca</text><text id="zs1" class="ts" x="424" y="60" dominant-baseline="central">Máxima: entalla + carga concentrada</text></g>
<g id="lr2" class="tg"><circle id="lc2" cx="404" cy="102" r="11" fill="#EF9F27" stroke="var(--surface-2)" stroke-width="1.5"></circle><text id="ln2" class="th" x="404" y="102" text-anchor="middle" dominant-baseline="central" style="fill:#412402">2</text><text class="th" x="424" y="95" dominant-baseline="central">Salida de rosca (runout)</text><text id="zs2" class="ts" x="424" y="112" dominant-baseline="central">Alta: cambio de sección</text></g>
<g id="lr3" class="tg"><circle id="lc3" cx="404" cy="154" r="11" fill="#FAC775" stroke="var(--surface-2)" stroke-width="1.5"></circle><text id="ln3" class="th" x="404" y="154" text-anchor="middle" dominant-baseline="central" style="fill:#412402">3</text><text class="th" x="424" y="147" dominant-baseline="central">Filete bajo la cabeza</text><text id="zs3" class="ts" x="424" y="164" dominant-baseline="central">Moderada: filete bajo cabeza</text></g>
<g id="lr4" class="tg"><circle id="lc4" cx="404" cy="206" r="11" fill="none" stroke="var(--border-strong)" stroke-width="1.5"></circle><text id="ln4" class="th" x="404" y="206" text-anchor="middle" dominant-baseline="central" style="fill:var(--text-secondary)">4</text><text class="th" x="424" y="199" dominant-baseline="central">Plano de corte entre placas</text><text id="zs4" class="ts" x="424" y="216" dominant-baseline="central">Sin efecto relevante aquí</text></g>
<g id="lr5" class="tg"><circle id="lc5" cx="404" cy="258" r="11" fill="none" stroke="var(--border-strong)" stroke-width="1.5"></circle><text id="ln5" class="th" x="404" y="258" text-anchor="middle" dominant-baseline="central" style="fill:var(--text-secondary)">5</text><text class="th" x="424" y="251" dominant-baseline="central">Contacto con el agujero</text><text id="zs5" class="ts" x="424" y="268" dominant-baseline="central">Sin efecto relevante aquí</text></g>
<circle cx="398" cy="312" r="6" fill="#A32D2D"></circle><text class="ts" x="410" y="312" dominant-baseline="central">Máxima</text>
<circle cx="472" cy="312" r="6" fill="#EF9F27"></circle><text class="ts" x="484" y="312" dominant-baseline="central">Alta</text>
<circle cx="526" cy="312" r="6" fill="#FAC775"></circle><text class="ts" x="538" y="312" dominant-baseline="central">Moderada</text>
</svg>
<p id="cap"></p>
</div>
</body>
</html>
